# Apollo Light for RMUX
# Generated from palette/apollo-light.json by scripts/generate.py; do not edit.
# RMUX/tmux-compatible theme options only; no status content, keys, or shell behavior.

set-option -g status-style "bg=#f9f5d7,fg=#3c3836"
